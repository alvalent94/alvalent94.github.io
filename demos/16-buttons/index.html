<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Buttons</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="section-1">
            <a href="#" class="button simple">Click Me</a>
            <a href="#" class="button background">Learn More</a>
            <a href="#" class="button border">Click Now</a>
        </div>
        <div id="section-2">
            <a href="#" class="button background same">Click Me</a>
            <a href="#" class="button border same">Learn More</a>
            <a href="#" class="button border same">Click Now</a>
        </div>
        <div id="section-3">
            <a href="#" class="button simple wide">Click Me</a>
            <a href="#" class="button simple wide">Learn More</a>
            <a href="#" class="button simple wide">Click Now</a>
        </div>
    </body>
</html>
