<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Me Bay Product Page</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="colorful-text">
            <span class="purple">m</span>
            <span class="red">e</span>
            <span class="blue">b</span>
            <span class="yellow">a</span>
            <span class="green">y</span>
        </div>
        <!-- Flexbox Container -->
        <div id="layout">
            <!-- Flex Item -->
            <div id="thumbnail-column">
                <img
                    src="images/grffey1.jpg"
                    alt="griffey2"
                    class="border"
                >
                <img
                    src="images/grffey3.jpg"
                    alt="griffey3"
                >
                <img
                    src="images/grffey2.jpg"
                    alt="griffey4"
                >
                <img
                    src="images/grffey4.jpg"
                    alt="griffey5"
                >
                <img
                    src="images/griffey5.jpg"
                    alt="griffey5"
                >
                <img
                    src="images/griffey6.jpg"
                    alt="griffey6"
                >
            </div>

            <!-- Flex Item -->
            <div id="featured-image-column">
                <img 
                    src="images/grffey1.jpg" 
                    alt="griffey"
                >
            </div>

            <!-- Flex Item -->
            <div id="product-info-column">
                <h3>
                    Nike Air Griffey Max 1 Freshwater 
                    (2025) DM8311-001 - Men's Sizing - Brand NEW
                </h3>
                <div class="border-3">
                    <p>
                        <span class="bold">Soledout NC</span>
                        <span class="gray">(1665)</span>
                    </p>
                    <a href="#" class="hyperlink">
                        99.9% Positive
                    </a>
                    <a href="#" class="hyperlink">
                        Seller's other items
                    </a>
                    <a href="#" class="hyperlink">
                        Contact seller
                    </a>
                </div>
                <h2>US $139.99</h2>
                <p>
                    Condition: <span class="bold">New with box</span>
                </p>
                <p>
                    <span class="text-box-1">
                        <span class="gray">US Shoe Size:</span> 
                        <span class="bold">
                            8
                        </span>
                    </span>
                </p>
                <p>
                    Quantitiy: <span class="text-box-2">1</span>
                    <span class="gray-letters">10 available</span>
                    <span class="red-letters">5 left</span>
                </p>
                <a href="#" class="button-1">
                    Buy It Now
                </a>
                <a href="#" class="button-2">
                    Add To Cart
                </a>
                <a href="#" class="button-2">
                    Add To Watchlist
                </a>
            </div>
        </div>
    </body>
</html>
