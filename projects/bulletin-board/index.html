<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="row">
                <div class="post-it">
                    <h2>Morning Routine</h2>
                    <ul>
                        <li>Wake up</li>
                        <li>Shower</li>
                        <li>Workout</li>
                        <li>Eat</li>
                    </ul>
                </div>
                <div class="post-it">
                    <h2>Smile</h2>
                    <ul>
                        <li>Love Your Life</li>
                        <li>Pray Every Morning</li>
                    </ul>
                </div>
                <div class="post-it">
                    <h2>To Do</h2>
                    <ul>
                        <li>Throw out the TRASH!</li>
                        <li>Draw</li>
                        <li>Cook</li>
                    </ul>
                </div>
                <div>
                    <img
                        class="img-post"
                        src="images/gym.jpg"
                        height="150"
                        alt="gym"
                    >
                    <img
                        class="img-post"
                        src="images/trail.jpg"
                        height="150"
                        alt="trail"
                    >
                    <img
                        class="img-post"
                        src="images/running.jpg"
                        height="150"
                        alt="running"
                    >
                </div>
                <div class="post-it">
                    <h2>Daily Goal</h2>
                    <p>
                        Run Trail for 3 miles
                    </p>
                </div>
                <div class="post-it">
                    <h2>Daily Quote</h2>
                    <p>
                        "It's hard to stand out but its 
                        easy to fit in"
                        <br>
                        -Jeff Hardy
                    </p>
                </div>
                <div class="post-it">
                    <h1>GET THAT MONAYYY!</h1>
                </div>
            </div>
        </div>
    </body>
</html>
