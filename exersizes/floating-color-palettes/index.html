<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palattes</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div class="color-palette">
            <h2>Awesome Colors</h2>
            <h4 class="color" id="color-1">#D8A47F</h4>
            <h4 class="color" id="color-2">#EF8354</h4>
            <h4 class="color" id="color-3">#EE4B6A</h4>
            <h4 class="color" id="color-4">#DF3B57</h4>
        </div>
        <div class="color-palette">
            <h2>Spectacular Colors</h2>
            <h4 class="color" id="color-5">#5C0029</h4>
            <h4 class="color" id="color-6">#61304B</h4>
            <h4 class="color" id="color-7">#857C8D</h4>
            <h4 class="color" id="color-8">#94BFBE</h4>
        </div>
        <div class="color-palette">
            <h2>Amazing Colors</h2>
            <h4 class="color" id="color-9">#CADBC0</h4>
            <h4 class="color" id="color-10">#C94277</h4>
            <h4 class="color" id="color-11">#A27E6F</h4>
            <h4 class="color" id="color-12">#94524A</h4>
        </div>
    </body>
</html>
